name: Bug report
description: Report a reproducible problem in DevTask
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, tokens, personal data, and private repository details before submitting.
  - type: input
    id: platform
    attributes:
      label: Platform and device
      description: Include iOS, Android, web, simulator, emulator, or device model.
      placeholder: iOS 18 on iPhone 15
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: 123abc or 1.0.0
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data.
          required: true
